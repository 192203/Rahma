
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قريباً | Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background:
    radial-gradient(circle at center, #0b2145 0%, #06142b 45%, #02060e 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 750px;
    padding: 40px 20px;
    animation: fadeIn 1.5s ease;
}

.logo {
    font-size: 25px;
    color: #d6b46a;
    font-weight: 800;
    margin-bottom: 45px;
}

.line {
    width: 90px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #d6b46a, transparent);
    margin: 25px auto;
}

h1 {
    font-size: clamp(55px, 10vw, 100px);
    font-weight: 800;
    color: #d6b46a;
    text-shadow: 0 0 30px rgba(214,180,106,.25);
}

h2 {
    font-size: 25px;
    margin-top: 15px;
    color: #fff;
}

p {
    color: #aFC7E8;
    font-size: 17px;
    line-height: 2;
    margin-top: 20px;
}

.badge {
    display: inline-block;
    border: 1px solid rgba(214,180,106,.5);
    color: #d6b46a;
    padding: 8px 25px;
    border-radius: 30px;
    margin-top: 35px;
    font-size: 14px;
    letter-spacing: 2px;
}

.footer {
    margin-top: 65px;
    color: #7189a8;
    font-size: 13px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width:600px) {
    h2 { font-size: 20px; }
    p { font-size: 15px; }
    .logo { font-size: 20px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        ⚖ مكتب المحامي فريد حسام عبدالهادي
    </div>

    <div class="line"></div>

    <h1>قريباً</h1>

    <h2>نستعد للانطلاق بحلة جديدة</h2>

    <p>
        نعمل حالياً على تجهيز موقعنا الإلكتروني
        لنقدم لكم تجربة أفضل وخدمات قانونية
        أكثر سهولة واحترافية.
        <br>
        نلقاكم قريباً بإذن الله.
    </p>

    <div class="badge">
        COMING SOON
    </div>

    <div class="line"></div>

    <div class="footer">
        جميع الحقوق محفوظة © 2026
        <br>
        المحامي فريد حسام عبدالهادي
    </div>

</div>

</body>
</html>
